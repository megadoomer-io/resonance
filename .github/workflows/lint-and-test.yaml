name: Lint & Test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: resonance
          POSTGRES_PASSWORD: resonance
          POSTGRES_DB: resonance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resonance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: resonance
      PGPASSWORD: resonance
      PGDATABASE: resonance
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src/

      - name: Tests
        run: uv run pytest --tb=short

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Install JS deps
        run: npm ci

      - name: Front-end unit tests (vitest)
        run: npm test
